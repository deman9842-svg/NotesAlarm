name: Build NoteShift APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "source_parts/**"
      - "v97_patch_parts/**"
      - "v98_patch_parts/**"
      - "v99_patch_parts/**"
      - "v100_patch_parts/**"
      - "v101_patch_parts/**"
      - "v102_patch_parts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Rebuild source archive
        run: |
          cat source_parts/part_*.b64 > source.b64
          base64 -d source.b64 > NoteShiftApp_v96_OPTIMIZED.zip
          echo "715ab8e27201c3ac91196b485dcd3fcce81bc39d8d94cade1f2c1255f9fa369f  NoteShiftApp_v96_OPTIMIZED.zip" | sha256sum -c -
          unzip -q NoteShiftApp_v96_OPTIMIZED.zip

      - name: Apply v97 fast-tabs patch
        run: |
          cat v97_patch_parts/part_*.patch > /tmp/v97_fast_tabs.patch
          cd NoteShiftApp_v96_OPTIMIZED
          git init -q
          git apply --check /tmp/v97_fast_tabs.patch
          git apply /tmp/v97_fast_tabs.patch

      - name: Apply v98 smooth-release patch
        run: |
          cat v98_patch_parts/part_* > /tmp/v98_smooth.patch
          cd NoteShiftApp_v96_OPTIMIZED
          git apply --check /tmp/v98_smooth.patch
          git apply /tmp/v98_smooth.patch

      - name: Apply v99 tab-fix patch
        run: |
          cat v99_patch_parts/part_* > /tmp/v99_tab_fix.patch
          cd NoteShiftApp_v96_OPTIMIZED
          git apply --check /tmp/v99_tab_fix.patch
          git apply /tmp/v99_tab_fix.patch

      - name: Apply v100 notes-navigation fix
        run: |
          cat v100_patch_parts/part_* > /tmp/v100_notes_nav.patch
          cd NoteShiftApp_v96_OPTIMIZED
          git apply --check /tmp/v100_notes_nav.patch
          git apply /tmp/v100_notes_nav.patch

      - name: Apply v101 reliable-navigation fix
        run: |
          cat v101_patch_parts/part_* > /tmp/v101_reliable_nav.patch
          cd NoteShiftApp_v96_OPTIMIZED
          git apply --check /tmp/v101_reliable_nav.patch
          git apply /tmp/v101_reliable_nav.patch
          grep -q 'versionCode = 101' app/build.gradle.kts
          grep -q 'versionName = "1.10.14"' app/build.gradle.kts
          grep -q 'ReliableAppNavHost' app/src/main/java/com/example/noteshiftapp/MainActivity.kt
          grep -q 'startDestination = AppDestination.Notes.route' app/src/main/java/com/example/noteshiftapp/navigation/ReliableAppNavHost.kt
          grep -q 'DropdownMenuItem' app/src/main/java/com/example/noteshiftapp/ui/components/AppLauncherMenu.kt

      - name: Apply v102 direct-notes-return fix
        run: |
          cd NoteShiftApp_v96_OPTIMIZED
          python3 - <<'PY'
          from pathlib import Path

          gradle = Path("app/build.gradle.kts")
          text = gradle.read_text()
          assert 'versionCode = 101' in text
          assert 'versionName = "1.10.14"' in text
          text = text.replace('versionCode = 101', 'versionCode = 102', 1)
          text = text.replace('versionName = "1.10.14"', 'versionName = "1.10.15"', 1)
          gradle.write_text(text)

          nav = Path("app/src/main/java/com/example/noteshiftapp/navigation/ReliableAppNavHost.kt")
          text = nav.read_text()
          block_start = text.index("    val navigateToDestination:")
          block_end = text.index("\n\n    NavHost(", block_start)
          replacement = '''    val navigateToDestination: (AppDestination) -> Unit = { destination ->
              if (destination in AppDestination.bottomItems) {
                  if (destination == AppDestination.Notes) {
                      if (currentRoute != AppDestination.Notes.route) {
                          val returnedToNotes = navController.popBackStack(
                              route = AppDestination.Notes.route,
                              inclusive = false,
                          )
                          if (!returnedToNotes) {
                              navController.navigate(AppDestination.Notes.route) {
                                  popUpTo(navController.graph.startDestinationId) {
                                      inclusive = true
                                  }
                                  launchSingleTop = true
                              }
                          }
                      }
                  } else if (destination.route != currentRoute) {
                      navController.navigate(destination.route) {
                          popUpTo(navController.graph.startDestinationId) { saveState = true }
                          launchSingleTop = true
                          restoreState = true
                      }
                  }
              }
          }'''
          text = text[:block_start] + replacement + text[block_end:]
          nav.write_text(text)
          PY
          grep -q 'versionCode = 102' app/build.gradle.kts
          grep -q 'versionName = "1.10.15"' app/build.gradle.kts
          grep -q 'popBackStack' app/src/main/java/com/example/noteshiftapp/navigation/ReliableAppNavHost.kt
          grep -q 'destination == AppDestination.Notes' app/src/main/java/com/example/noteshiftapp/navigation/ReliableAppNavHost.kt

      - name: Build signed RELEASE APK
        run: |
          cd NoteShiftApp_v96_OPTIMIZED
          rm -f local.properties
          gradle :app:assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../NoteShiftApp_v1.10.15_DIRECT_NOTES.apk

      - name: Verify APK and signature
        run: |
          test -f NoteShiftApp_v1.10.15_DIRECT_NOTES.apk
          ls -lh NoteShiftApp_v1.10.15_DIRECT_NOTES.apk
          sha256sum NoteShiftApp_v1.10.15_DIRECT_NOTES.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs NoteShiftApp_v1.10.15_DIRECT_NOTES.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteShiftApp-v102-APK
          path: NoteShiftApp_v1.10.15_DIRECT_NOTES.apk
          if-no-files-found: error
          retention-days: 30
