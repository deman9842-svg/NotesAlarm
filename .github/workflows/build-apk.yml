name: Build NoteShift APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "source_parts/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Rebuild source archive
        run: |
          cat source_parts/part_*.b64 > source.b64
          base64 -d source.b64 > NoteShiftApp_v96_OPTIMIZED.zip
          echo "715ab8e27201c3ac91196b485dcd3fcce81bc39d8d94cade1f2c1255f9fa369f  NoteShiftApp_v96_OPTIMIZED.zip" | sha256sum -c -
          unzip -q NoteShiftApp_v96_OPTIMIZED.zip

      - name: Build signed debug APK
        run: |
          cd NoteShiftApp_v96_OPTIMIZED
          rm -f local.properties
          gradle :app:assembleDebug --no-daemon --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk ../NoteShiftApp_v1.10.9_OPTIMIZED.apk

      - name: Verify APK exists
        run: |
          test -f NoteShiftApp_v1.10.9_OPTIMIZED.apk
          ls -lh NoteShiftApp_v1.10.9_OPTIMIZED.apk
          sha256sum NoteShiftApp_v1.10.9_OPTIMIZED.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NoteShiftApp-v96-APK
          path: NoteShiftApp_v1.10.9_OPTIMIZED.apk
          if-no-files-found: error
          retention-days: 30
